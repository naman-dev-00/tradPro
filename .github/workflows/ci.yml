name: TradePro CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend API Tests & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Pytest Suite with Warning Enforcement
        working-directory: apps/api
        env:
          APP_ENV: test
        run: |
          python -m pytest -W error -W "ignore:Using \`httpx\` with \`starlette.testclient\` is deprecated:DeprecationWarning"

  frontend:
    name: Frontend Web Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: apps/web
        run: npm run test

      - name: Run ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Run TypeScript Compiler Check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build Next.js Web App
        working-directory: apps/web
        run: npm run build
