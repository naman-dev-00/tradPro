name: TradePro CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend API Tests & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Pytest Suite with Warning Enforcement
        working-directory: apps/api
        env:
          APP_ENV: test
        run: |
          python -m pytest

  backend-postgres-compatibility:
    name: Backend PostgreSQL Compatibility & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradepro_ci
          POSTGRES_PASSWORD: tradepro_ci_password
          POSTGRES_DB: tradepro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradepro_ci -d tradepro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: PostgreSQL Authentication Preflight
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://tradepro_ci:tradepro_ci_password@127.0.0.1:5432/tradepro_test
        run: |
          python -c "import os, sqlalchemy; engine = sqlalchemy.create_engine(os.environ['DATABASE_URL']); conn = engine.connect(); conn.execute(sqlalchemy.text('SELECT 1')); conn.close(); print('Successfully authenticated to PostgreSQL database.')"

      - name: Upgrade Empty Database to Alembic Head
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://tradepro_ci:tradepro_ci_password@127.0.0.1:5432/tradepro_test
        run: |
          alembic upgrade head
          alembic current

      - name: Run Pytest Suite against PostgreSQL
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://tradepro_ci:tradepro_ci_password@127.0.0.1:5432/tradepro_test
        run: |
          python -m pytest

  frontend:
    name: Frontend Web Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: apps/web
        run: npm run test

      - name: Run ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Run TypeScript Compiler Check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build Next.js Web App
        working-directory: apps/web
        run: npm run build
